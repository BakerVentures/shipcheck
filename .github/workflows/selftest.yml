name: Self-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scanner self-test
        run: python3 scripts/selftest.py
      - name: Manifests are valid JSON
        run: |
          python3 - <<'PY'
          import json
          for f in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json',
                    'scripts/data/rn_sdk_map.json', 'corpus/manifest.json']:
              json.load(open(f))
          print("ok")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: License endpoint syntax
        run: node --check server/validate.js
